<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#1E2340"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14151d"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Pocket Ledger — a private personal finance dashboard."
    />

    <!--
      Applies a saved theme choice before first paint, so switching pages or
      reloading never flashes the wrong theme. "system" (the default) stores
      no attribute at all and leaves it to the prefers-color-scheme media
      query in styles.css. Kept inline and tiny on purpose — this has to run
      before the stylesheet does.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pocket-ledger-theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          // localStorage unavailable (private mode, etc.) — system theme applies.
        }
      })();
    </script>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Add to Home Screen on iOS opens standalone, without Safari chrome. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pocket Ledger" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Pocket Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
